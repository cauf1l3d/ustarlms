name: USTAR Connect and team package

on:
  pull_request:
    branches: [feat/reward-shop-ux-20261112, main]
    paths:
      - 'scripts/infra/*connect_team_release.py'
      - 'tests/r16/test_connect_team_release.py'
      - '.github/workflows/ustar-connect-team-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.3'
          coverage: none
      - name: Check transactions and build the reproducible archive
        run: |
          python3 -m unittest -v tests.r16.test_connect_team_release
          python3 scripts/infra/build_connect_team_release.py --output artifacts
          python3 scripts/infra/build_connect_team_release.py --output repeat
          cmp artifacts/ustar-connect-team-814a99d9.tar.gz repeat/ustar-connect-team-814a99d9.tar.gz
          gzip -t artifacts/ustar-connect-team-814a99d9.tar.gz
          mkdir verify
          tar --no-same-owner -xzf artifacts/ustar-connect-team-814a99d9.tar.gz -C verify
          cd verify
          sha256sum --check --strict SHA256SUMS
          python3 -I -B update.py --verify
          printf '\n' >> payload/connect_announcements.php
          if python3 -I -B update.py --verify; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ustar-connect-team-package
          path: artifacts/ustar-connect-team-814a99d9.tar.gz
          if-no-files-found: error
