rules:
- Notes stay owner-private; assigned work uses current scope and review authority
- Versions/reports preserved, commands locked and revision checked
- KPI excludes private notes, cancellations and future deadline work
entry_points:
- moodle/local/ustar/tasks.php
- moodle/local/ustar/checklist_studio.php
- moodle/local/ustar/notebook.php
- moodle/local/ustar/board_api.php
- moodle/local/ustar/home.php
review_method: static source navigation; no new production scenario acceptance
scenarios:
- name: assigned_visibility
  source: moodle/local/ustar/classes/task_workspace/service.php
  behavior: can_view_record checks assigned privacy and active actor; assignee or
    current company actor with canassign may view; notes remain private
- name: reviewer_resolution
  source: moodle/local/ustar/classes/task_workspace/service.php
  behavior: current manager with canassign is preferred; no-manager fallback uses
    eligible company creator, then HRD when reviewer is zero; review also checks visibility
- name: policy
  source: moodle/local/ustar/classes/task_workspace/policy.php
  behavior: defaults Europe/Moscow, workdays 09:00-18:00; escalation uses direct/parent/HRD;
    reports validate 1-40 check/text/number/photo fields
coverage_limit: Selected command/read paths only; complete endpoint, file access and
  actor/scope negative-path audit remains open
