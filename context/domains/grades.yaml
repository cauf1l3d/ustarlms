domain: grades
reviewed_at: '2026-10-17'
source_commit: a3df57831a5ed49b901e5116ee800f2217fb61e9
purpose: Версионированные лестницы, привязки должностей и личный грейд
services:
- moodle/local/ustar/classes/grade_ladders.php
- moodle/local/ustar/classes/grade_rules.php
- moodle/local/ustar/classes/grade_promotion.php
- moodle/local/ustar/classes/grade_assignment_directory.php
- moodle/local/ustar/classes/career_grades.php
tables:
- local_ustar_grade_ladders
- local_ustar_grade_ladder_ver
- local_ustar_grade_bindings
- local_ustar_grade_rules
- local_ustar_employee_grades
- local_ustar_grade_requests
rules:
- Published ladders immutable; position binding uses stable string ID
- Initial bound grade can be assigned within approved HR staffing command (PR59)
- Reading does not assign grades; version transfer requires explicit reconciliation
- Scheduled auto request is not automatic approval
entry_points:
- moodle/local/ustar/grades.php
- moodle/local/ustar/route_career.php
review_method: static source navigation; no new production scenario acceptance
scenarios:
- name: eligibility
  source: moodle/local/ustar/classes/grade_promotion.php
  behavior: current/eligibility require a recorded grade and published matching ladder/rules;
    changed ladder needs explicit HR reconciliation
- name: approve_or_return
  source: moodle/local/ustar/classes/grade_promotion.php
  behavior: decide rechecks current direct manager and rejects self-review; locked
    transaction revalidates rule hash, position, from/to and eligibility; return needs
    reason
- name: commit_delivery
  source: moodle/local/ustar/classes/grading_commit.php
  behavior: notification failure after confirmed commit is distinct from rollback;
    inspect grading_commit::finish before retrying writes
coverage_limit: Selected command/read paths only; complete endpoint, file access and
  actor/scope negative-path audit remains open
