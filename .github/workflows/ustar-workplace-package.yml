name: USTAR workplace package

on:
  push:
    branches: [feat/workplace-migration-20261122]
    paths:
      - '.github/workflows/ustar-workplace-package.yml'
      - 'scripts/infra/*workplace_release.py'
      - 'tests/workplace_release_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Verify reproducible archive and installer recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.3'
          coverage: none
      - name: Build twice, validate checksums and exercise the installer
        run: |
          set -euo pipefail
          python3 scripts/infra/build_workplace_release.py --output artifacts | tee artifacts-build.json
          python3 scripts/infra/build_workplace_release.py --output repeat > repeat-build.json
          name=ustar-workplace-33189142.tar.gz
          cmp "artifacts/$name" "repeat/$name"
          mkdir verify
          tar -xzf "artifacts/$name" -C verify
          (cd verify && sha256sum --check --strict SHA256SUMS && python3 -I -B update.py --verify)
          python3 tests/workplace_release_test.py "artifacts/$name" -v
          printf '\n' >> verify/payload/messages.php
          if (cd verify && python3 -I -B update.py --verify); then
            echo 'Tampered package accepted' >&2
            exit 1
          fi
          (cd artifacts && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ustar-workplace-release
          path: artifacts/
          if-no-files-found: error
