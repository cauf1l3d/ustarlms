domain: routes
reviewed_at: '2026-10-17'
source_commit: 6c56a5b6ab830b97b706a5d7028b49cfae31e7a4
purpose: Семейства маршрутов, scope, immutable publication и launch
services:
- moodle/local/ustar/classes/route_model.php
- moodle/local/ustar/classes/route_family.php
- moodle/local/ustar/classes/route_scope.php
- moodle/local/ustar/classes/route_commands.php
- moodle/local/ustar/classes/route_continue.php
- moodle/local/ustar/classes/route_intro_transfer.php
- moodle/local/ustar/classes/forced_retraining.php
tables:
- local_ustar_route_families
- local_ustar_routes
- local_ustar_route_points
- local_ustar_route_scope
- local_ustar_route_versions
- local_ustar_route_progress
- local_ustar_completion_cycle
rules:
- Parent physical point and position override follow ADR-0004
- Published versions and progress are separate
- No hardcoded production point/version IDs in new implementations
- Direct launches must check learning eligibility and adaptation gates
entry_points:
- moodle/local/ustar/route.php
- moodle/local/ustar/route_studio.php
- moodle/local/ustar/activity_launch.php
- moodle/local/ustar/forced_retraining.php
review_method: static source navigation; no new production scenario acceptance
scenarios:
- name: publish_version
  source: moodle/local/ustar/classes/route_commands.php
  behavior: publish_version validates positive identifiers and expectedmodified, then
    delegates to route_model; endpoint/service capability and scope checks require
    separate review
- name: family_scope
  source: moodle/local/ustar/classes/route_scope.php
  behavior: resolve family/physical point/position scope with ADR-0004; published
    version, progress and completion cycle remain distinct
coverage_limit: Selected command/read paths only; complete endpoint, file access and
  actor/scope negative-path audit remains open
