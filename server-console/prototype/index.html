:root[data-theme="light"] {

  --sidebar: #eaf0f6;

  --field: #ffffff;
  --subtle: #edf2f7;

  --line: #becbd9;

  --neutral: #526880;
  --grid: #bcc9d7;
  --track: #d7e1ec;
  --accent: #175784;
  --accent-surface: #dcebf7;
  --accent-border: #769cbd;

  --ok: #166443;
  --ok-surface: #e0f1e8;

  --warning: #785000;

}

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--text);
}
button,
input,
select {
  font: inherit;
  color: var(--text);
}
button,
input,
select {
  min-height: 44px;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
}
button:hover {
  background: var(--hover);
}
button:disabled {
  cursor: wait;
  opacity: 0.65;
}
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
h1,
h2,
p {
  margin: 0;
  color: var(--text);
}
h1 {
  font-size: 30px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.65px;
}
h2 {
  font-size: 20px;
  font-weight: 600;

}
p {
  margin: 12px 0;
}
small,
.muted {

  font-size: 16px;
  line-height: 1.55;
}
label {
  display: block;
}
input {
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--field);
  padding: 11px 13px;
  margin: 8px 0 18px;
}
select {

}
.app {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
}
aside {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 28px 12px 20px;
  background: var(--sidebar);

}
.brand {

  font-weight: 600;

}
.brand > b,
.brand-mark {

  place-items: center;

  height: 36px;
  border-radius: 9px;

}
.brand small {
  display: block;
  font-size: 16px;
  font-weight: 400;

}
nav {
  display: grid;

}
nav button {
  display: flex;
  align-items: center;
  gap: 12px;

  text-align: left;
  font-size: 16px;

}
nav button[aria-current] {
  background: var(--accent-surface);

  box-shadow: inset 3px 0 var(--accent);
}
.nav-icon {

  align-items: center;

}
.sidebar-foot {
  margin-top: auto;
  padding: 28px 8px 0;
}
.sidebar-foot button {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  align-items: center;

  color: var(--secondary);
  padding: 10px 4px;
}
.mode {
  display: inline-flex;
  padding: 5px 8px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--secondary);
  font-size: 16px;
}
.workspace {
  padding: 30px 30px 24px;
  max-width: 1800px;
  width: 100%;
  min-width: 0;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.4px;
  color: var(--secondary);
}
.env {
  color: var(--ok);
  background: var(--ok-surface);
  border: 1px solid var(--ok-border);

  border-radius: 4px;
  letter-spacing: 0.3px;

}
header h1 {
  margin-top: 9px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
}
.freshness {
  color: var(--secondary);
  font-size: 16px;
  max-width: 230px;
}
.freshness::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  background: var(--ok);
  border-radius: 50%;
  margin-right: 8px;
}
.freshness.old::before {
  background: var(--warning);
}
.health-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.health {
  display: flex;
  flex-direction: column;
  align-items: flex-start;

  border-top: 3px solid var(--neutral);
}
.health-ok {
  border-top-color: var(--ok);
}
.health-warning {
  border-top-color: var(--warning);
}
.health-critical {
  border-top-color: var(--critical);
}
.health > span:first-child {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
}
.health .badge {

}
.health small {

}
.badge {

  color: var(--secondary);
  font-size: 16px;

}
.badge i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.badge.ok,
.status-ok {

}
.badge.warning {

}
.badge.critical,
.status-bad {

}
.badge.no_data i {

}
.metrics {

}
.metric {

  border: 1px solid var(--line);
  border-radius: 9px;
  border-top: 3px solid var(--metric-color);

}
.metric-ram {
  --metric-color: var(--ram);
}
.metric-http {
  --metric-color: var(--http);
}
.metric-backup {
  --metric-color: var(--backup);
}
.metric-cron {
  --metric-color: var(--ram);
}
.priority-metrics .badge {
  margin-bottom: 10px;
}
.priority-metrics .metric[data-status="no_data"] {
  border-top-color: var(--neutral);
}
@media (max-width: 440px) {
  .priority-metrics .metric > strong,
  .priority-metrics .metric > .badge {
    grid-column: 1 / -1;
    justify-self: start;
  }
}
.cron-details {
  margin-bottom: 18px;
}
.cron-details dl {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 12px 24px;
}
.cron-details dt,
.cron-details dd {
  margin: 0;
  overflow-wrap: anywhere;
}
@media (max-width: 600px) {
  .cron-details dl {
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
  }
  .cron-details dd {
    margin-bottom: 12px;
  }
}
.metric-disk {
  --metric-color: var(--disk);
}
.metric-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--secondary);
  font-size: 16px;
  line-height: 1.5;
}
.metric-label svg {
  flex-shrink: 0;
  color: var(--metric-color);
}
.metric > strong {
  display: block;
  font-size: 35px;
  line-height: 1.25;
  font-weight: 550;
  letter-spacing: -1px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  margin: 15px 0 8px;
}
.metric small {
  display: block;
  min-height: 44px;
  font-size: 16px;
  color: var(--secondary);
}
.metric progress {
  display: block;
  width: 100%;
  height: 5px;
  margin-top: 12px;
  border: 0;
  background: var(--track);
  accent-color: var(--metric-color);
  border-radius: 3px;
  overflow: hidden;
}
.metric progress::-webkit-progress-bar {
  background: var(--track);
}
.metric progress::-webkit-progress-value {
  background: var(--metric-color);
}
.metric progress::-moz-progress-bar {
  background: var(--metric-color);
}
.panel,
.attention {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
  min-width: 0;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}
.section-title > span {
  color: var(--secondary);
  font-size: 16px;
}
.attention {
  padding: 0;
  background: var(--warning-surface);
  border-color: var(--warning-border);
}
.attention .section-title {
  margin: 0;
  padding: 15px 18px;
  border-bottom: 1px solid var(--warning-border);
}
.attention h2 {
  color: var(--warning);
}
.checks {
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  margin-bottom: 20px;
}
.attention .checks {
  margin: 0;
  border: 0;
}
.check-row {
  display: flex;
  width: 100%;
  align-items: center;
  text-align: left;
  gap: 16px;
  padding: 15px 18px;
  min-height: 72px;
  color: var(--text);
}
.check-row + .check-row {
  border-top: 1px solid var(--line);
}
.check-row > span:first-child {
  flex: 1;
  min-width: 0;
}
.check-row strong {
  display: block;
  font-size: 16px;
  font-weight: 500;
}
.check-row small {
  display: block;
  font-size: 16px;
  color: var(--secondary);
  margin-top: 4px;
}
.chevron {
  font-size: 22px;
  color: var(--secondary);
}
.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}
.chart {
  padding: 18px 18px 14px;
  border-top: 2px solid var(--http);
  container-type: inline-size;
}
.chart-cpu {
  border-top-color: var(--cpu);
}
.chart-ram {
  border-top-color: var(--ram);
}
.chart-heading {
  display: flex;
  gap: 10px;
  align-items: center;
  min-width: 0;
}
.chart-heading > svg {
  flex-shrink: 0;
  color: var(--secondary);
}
.unit-label {
  color: var(--secondary);
  background: var(--chip);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 16px;
}
.plot-container {
  min-width: 0;
  position: relative;
}
.plot-container > svg {
  display: block;
  width: 100%;
  height: 250px;
  overflow: visible;
  touch-action: pan-y;
}
.grid-line {
  stroke: var(--grid);
  stroke-width: 0.7;
}
.grid-line.vertical {
  stroke: var(--grid);
  stroke-width: 0.6;
}
.axis-text {
  fill: var(--secondary);
  font-family: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.series-http {
  color: var(--http);
}
.series-cpu {
  color: var(--cpu);
}
.series-ram {
  color: var(--ram);
}
.chart-line {
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.chart-area {
  fill: currentColor;
  fill-opacity: 0.09;
  stroke: none;
}
.chart-point {
  fill: currentColor;
}
.crosshair {
  stroke: var(--crosshair);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}
.hover-point {
  fill: currentColor;
  stroke: var(--point-border);
  stroke-width: 2;
}
.sr-svg {
  fill: transparent;
  font-size: 0;
}
.chart-tooltip {
  position: absolute;
  pointer-events: none;
  top: 3px;
  right: 6px;
  min-width: 160px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  color: var(--text);
  box-shadow: 0 4px 16px var(--shadow);
  font-size: 16px;
}
.chart-tooltip time {
  display: block;
  color: var(--secondary);
  margin-bottom: 6px;
}
.chart-tooltip > div {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  margin-top: 5px;
}
.chart-tooltip > div > span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.chart-legend {
  margin-top: 8px;
}
.legend-header,
.legend-row {
  display: grid;
  grid-template-columns: minmax(75px, 0.9fr) repeat(3, minmax(90px, 1fr));
  gap: 8px;
  align-items: center;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.legend-header {
  color: var(--secondary);
  padding: 9px 0;
  border-top: 1px solid var(--line);
}
.legend-header > span:not(:first-child),
.legend-row > span {
  text-align: right;
}
.legend-row {
  border-top: 1px solid var(--line);
  color: var(--text);
}
.legend-value {
  color: var(--text);
  white-space: nowrap;
}
.legend-value::before {
  display: none;
}
@container (max-width: 390px) {
  .legend-header {
    display: none;
  }
  .legend-row {
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 12px 0 16px;
  }
  .legend-value {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .legend-value::before {
    content: attr(data-label);
    display: block;
    color: var(--secondary);
  }
}
.legend-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 7px;
  text-align: left;
  padding: 8px 0;
  min-width: 0;
  min-height: 44px;
  font-size: 16px;
  color: var(--text);
}
.legend-toggle:hover {
  background: transparent;
  text-decoration: underline;
}
.legend-swatch {
  display: inline-block;
  height: 3px;
  width: 17px;
  flex-shrink: 0;
  background: var(--secondary);
}
.legend-swatch.http {
  background: var(--http);
}
.legend-swatch.cpu {
  background: var(--cpu);
}
.legend-swatch.ram {
  background: var(--ram);
}
.muted-track .legend-swatch {
  background: transparent;
  border: 1px solid var(--secondary);
  height: 7px;
}
.muted-track .legend-toggle {
  text-decoration: line-through;
}
.chart-timezone {
  display: block;
  margin-top: 7px;
  color: var(--secondary);
  font-size: 16px;
}
.chart-no-data {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;

  padding: 25px 14px;

  background: var(--subtle);
}
.chart-no-data > svg {
  color: var(--neutral);
}
.chart-no-data strong {
  font-size: 16px;
  color: var(--text);
  font-weight: 500;
}
.chart-no-data > span {
  font-size: 16px;
}
.empty {
  padding: 26px 20px;
  margin-bottom: 20px;
  border: 1px dashed var(--border);
  border-radius: 9px;
  color: var(--secondary);
  background: var(--subtle);
}
.empty strong {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
}
.empty p {
  margin-bottom: 0;
  color: var(--secondary);
  font-size: 16px;
}
.intro {
  color: var(--secondary);
  font-size: 16px;
  margin: 0 0 24px;
  max-width: 850px;
}
.text-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--accent);
  font-size: 16px;
  padding: 7px 0 7px 12px;
}
.table-wrap {
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 16px;
  color: var(--text);
}
th {
  font-weight: 500;
  color: var(--secondary);
  font-size: 16px;
  padding: 12px 15px 12px 0;
}
td {
  padding: 18px 15px 18px 0;
  border-top: 1px solid var(--line);
  color: var(--text);
}
td strong {
  font-weight: 500;
  color: var(--text);
}
.container-name {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  overflow-wrap: anywhere;
}
.container-name svg {
  color: var(--accent);
  flex-shrink: 0;
}
dl {
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: 16px;
  font-size: 16px;
  margin: 24px 0;
}
dt {
  color: var(--secondary);
  overflow-wrap: anywhere;
}
dd {
  margin: 0;
  color: var(--text);
  overflow-wrap: anywhere;
}
.backup code {
  font-size: 16px;
  color: var(--text);
  background: var(--field);
  padding: 4px 6px;
  line-height: 1.6;
}
.data-row {
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding: 18px 0;
  font-size: 16px;
  color: var(--text);
}
.data-row:first-of-type {
  margin-top: 16px;
}
.data-row time,
.data-row > span:last-child {
  color: var(--secondary);
}
.data-row > span:first-child {
  overflow-wrap: anywhere;
}
.hdd-capacity .section-title,
.incident-history .section-title {
  flex-wrap: wrap;
}
.alert-rule,
.incident-row {
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin-top: 18px;
  min-width: 0;
}
