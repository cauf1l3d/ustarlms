name: ustar-stage1-rollback
version: "3.9"

services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ustar_stage1
      POSTGRES_USER: ustar_fixture
      POSTGRES_PASSWORD: fixture-only-not-a-production-secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustar_fixture -d ustar_stage1"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - isolated
    tmpfs:
      - /var/lib/postgresql/data

  runner:
    build:
      context: ../..
      dockerfile: tests/stage/Dockerfile
    entrypoint:
      - bash
      - -c
      - |
          set -Eeuo pipefail
          trap 'code=$?; echo "ROLLBACK_RUNNER_FAILED exit=$code line=$LINENO" >&2; ls -la /artifacts || true; tail -100 /artifacts/*.log 2>/dev/null || true; exit $code' ERR
          git config --global --add safe.directory /source
          bash -x /source/tests/stage/rollback_drill.sh 2>&1 | tee /artifacts/rollback-runner.log
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: fixture-only-not-a-production-secret
    volumes:
      - ../..:/source:ro
      - ../../artifacts:/artifacts
    networks:
      - isolated
    tmpfs:
      - /stage

networks:
  isolated:
    internal: true
