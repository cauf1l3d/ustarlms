domain: evidence
reviewed_at: '2026-10-17'
source_commit: e1d57f5bc28f6964afd20aeff7620345b34a80fe
purpose: Подтверждённые результаты, gates и completion cycles
services:
- moodle/local/ustar/classes/target_core.php
- moodle/local/ustar/classes/evidence.php
- moodle/local/ustar/classes/completion_cycle.php
- moodle/local/ustar/classes/route_point_evidence_provider.php
- moodle/local/ustar/classes/grading_commit.php
tables:
- local_ustar_evidence_rec
- local_ustar_evidence_evt
- local_ustar_gate_defs
- local_ustar_gate_decisions
- local_ustar_completion_cycle
- local_ustar_skill_evidence
rules:
- Canonical evidence_rec/evidence_evt are distinct from legacy skill_evidence requirements
- Keep old attempts/evidence/cycles when repeating or correcting learning
- Reset is not silent history deletion
entry_points:
- moodle/local/ustar/route.php
- moodle/local/ustar/achievements.php
review_method: static source navigation; not new production acceptance
scenarios:
- name: learning_vs_assessment
  source: moodle/local/ustar/classes/evidence.php
  behavior: evaluate_definition implements learning/assessment only; other labels
    return unsupported_type. Completion state1 satisfies learning but leaves assessment
    completed_ungraded; course-level assessment is unsupported_source
- name: fresh_remediation
  source: moodle/local/ustar/classes/route_point_evidence_provider.php
  behavior: state pins point/version to the same route and current position scope;
    all required evidence must be configured and fresh after failure cutoff. Later
    route versions do not silently replace pinned runtime
coverage_limit: Selected evaluators only; canonical evidence event writers, endpoint
  access and legacy bridges require separate audit
