name: USTAR backup restore controller
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/infra/backup_restore_test.py'
      - 'scripts/infra/backup_transfer.py'
      - 'scripts/infra/production_restore.py'
      - 'scripts/infra/ustar-restore-test-20261014.service'
      - 'tests/r16/test_backup_restore_test.py'
      - 'tests/r16/test_backup_transfer.py'
      - 'tests/r16/test_production_restore.py'
      - '.github/workflows/ustar-backup-restore-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-restore-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller-and-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Real root private paths,locks,state and simulated failure/lifetime boundaries
        run: sudo -n python3 -m unittest discover -s tests/r16 -p test_backup_restore_test.py -v
      - name: Portable kit and lifetime launcher
        run: sudo -n python3 -m unittest discover -s tests/r16 -p test_backup_transfer.py -v
      - name: Production recovery lifecycle and real loopback health
        run: sudo -n env USTAR_NATIVE_NETWORK_TESTS=1 python3 -m unittest discover -s tests/r16 -p test_production_restore.py -v
      - name: Systemd service parser and cleanup command
        run: |
          systemd-analyze verify scripts/infra/ustar-restore-test-20261014.service
          python3 - <<'PYGEN'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('transfer', 'scripts/infra/backup_transfer.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for seconds in (0, 7200):
              Path(f'/tmp/ustar-verify-{seconds}.service').write_text(module.unit_text(seconds, Path('/opt/ustar-transfer')))
          PYGEN
          systemd-analyze verify /tmp/ustar-verify-0.service /tmp/ustar-verify-7200.service
          systemctl show ustar-not-installed-20261015.service -p MainPID --value
      - name: Permanent production units and import service parser
        run: |
          python3 - <<'PYGEN'
          import importlib.util
          from pathlib import Path
          for name in ('production_restore', 'backup_transfer'):
              spec = importlib.util.spec_from_file_location(name, 'scripts/infra/' + name + '.py')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              if name == 'production_restore':
                  for filename, text in module.units().items():
                      Path('/tmp', filename).write_text(text)
                  copydir = Path('/tmp/ustar-copy-unit-check')
                  copydir.mkdir(exist_ok=True)
                  for filename, text in module.units(parallel_copy=True).items():
                      (copydir / filename).write_text(text)
              else:
                  ep = {'url': 'http://target-academy', 'bind': '0.0.0.0', 'port': 80, 'behind_proxy': False}
                  Path('/tmp/ustar-production-import.service').write_text(module.production_unit(ep, Path('/opt/ustar-transfer')))
                  Path('/tmp/ustar-production-copy-import.service').write_text(module.production_unit(ep, Path('/opt/ustar-transfer'), parallel_copy=True))
          PYGEN
          systemd-analyze verify /tmp/ustar-academy.service /tmp/ustar-academy-cron.service /tmp/ustar-academy-cron.timer /tmp/ustar-production-import.service
          systemd-analyze verify /tmp/ustar-copy-unit-check/ustar-academy.service /tmp/ustar-copy-unit-check/ustar-academy-cron.service /tmp/ustar-copy-unit-check/ustar-academy-cron.timer /tmp/ustar-production-copy-import.service
