<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USTAR — Управление сервером</title>
<style>
:root{--bg:#101114;--paper:#18191d;--ink:#e5e6eb;--muted:#999ba7;--line:#2a2b32;--accent:#827ced;--green:#8bc8ad;--red:#e59893;--blue:#b1aaf7;--radius:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);font-size:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
button,input,select{font:inherit}
button,a{ -webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
a{color:var(--blue);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a49afa;outline-offset:3px}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
aside{width:216px;position:fixed;inset:0 auto 0 0;background:#18191d;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 12px;z-index:3}
.brand{display:flex;align-items:center;gap:11px;padding:0 12px;margin-bottom:30px}
.brand-mark{width:34px;height:34px;background:var(--accent);border-radius:9px;display:grid;place-items:center;font-size:21px;font-weight:800}
.brand strong{font-size:19px;letter-spacing:1px}
.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:3px}
.nav-label{font-size:10px;letter-spacing:1.4px;color:var(--muted);padding:0 14px 10px}
.nav{display:grid;gap:4px}
.nav button{display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;color:#a8a9b3;padding:12px;border-radius:8px;font-size:13px}
.nav button[aria-current=page]{background:#27272f;color:#efeff3;font-weight:600}
.nav button:hover{background:#222329}
.nav button[aria-current=page]:hover{background:#27272f}
.nav .count{margin-left:auto;background:#363026;color:#d6b47d;border-radius:5px;padding:2px 6px;font-size:10px}
.aside-bottom{margin-top:auto;padding:20px 12px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
.hostline{color:var(--ink);font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.dot{height:7px;width:7px;background:#72b696;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.gray{background:#777b87}
.shell{margin-left:216px}
header{height:58px;border-bottom:1px solid var(--line);background:#18191d;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:15px}
.crumb{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.crumb strong{color:var(--ink);font-weight:500}
.header-right{display:flex;gap:18px;align-items:center;font-size:12px}
.user{display:flex;gap:8px;align-items:center}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#292a34;color:#c3bedf;font-size:11px;font-weight:600}
.icon-btn{border:0;background:none;padding:6px;color:#a3a5b0;display:flex;align-items:center}
.mobile-toggle{display:none}
.demo{font-size:11px;color:#aba8bd;background:#23222b;border:1px solid #36333f;padding:6px 10px;border-radius:6px}
.page{max-width:1450px;margin:auto;padding:28px 32px 40px}
.title-row{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}
h1{font-size:25px;letter-spacing:-.65px;line-height:1.2;margin:0 0 8px;font-weight:600}
h2{font-size:15px;letter-spacing:-.2px;margin:0;font-weight:620}
h3{font-size:13px;margin:0 0 9px}
p{line-height:1.6}
.sub{font-size:12px;color:var(--muted);margin:0}
.buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:8px 12px;border:1px solid #35363e;border-radius:7px;background:white;color:var(--ink);font-size:12px;font-weight:550}
.btn:hover{background:#2a2b34}
.btn.primary{background:#7169d4;color:white;border-color:#7169d4}
.btn.primary:hover{background:#8279e6}
.btn.danger{color:var(--red);border-color:#5b3434}
.btn.text{background:none;border:0;color:var(--blue);padding:5px 0}
.btn svg{width:15px;height:15px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:20px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);min-width:0}
.metric{padding:18px 20px}
.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.metric-top svg{width:17px;height:17px;color:#858894}
.metric-value{font-size:23px;font-weight:620;letter-spacing:-.6px;margin:15px 0 9px;display:flex;gap:9px;align-items:center}
.metric-value .dot{width:8px;height:8px}
.metric-bottom{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;white-space:nowrap;border-radius:5px;padding:4px 7px;background:#292b33;color:#adafbb}
.pill.good{color:#8bc8ad;background:#1e3029}
.pill.warn{color:#dbbc80;background:#322c21}
.pill.bad{color:#e6a29d;background:#382727}
.notice{border:1px solid #3a3429;background:#201e1a;border-radius:9px;padding:15px 18px;display:flex;gap:12px;align-items:center;margin-bottom:20px}
.notice svg{color:#c1a36d}
.notice .notice-body{flex:1;line-height:1.45;font-size:12px}
.notice small{display:block;color:#b0a38e;margin-top:3px}
.row{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;margin-bottom:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
.card-head span.muted{font-size:11px;color:var(--muted)}
.card-body{padding:20px}
.resource{display:grid;grid-template-columns:100px 1fr 80px;gap:20px;align-items:center;margin-bottom:22px;font-size:12px}
.resource:last-child{margin-bottom:0}
.resource-name{color:#b0b1bb}
.resource strong{font-weight:550;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:5px;background:#2b2d35;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#8580ce;border-radius:5px}
.bar.yellow i{background:#a69a72}
.storage-foot{border-top:1px solid var(--line);padding:13px 20px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;font-size:11px}
.detail-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:17px;font-size:12px}
.detail-row:last-child{margin-bottom:0}
.detail-row span:first-child{color:var(--muted)}
.detail-row strong{font-weight:550;min-width:0;overflow-wrap:anywhere;text-align:right}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap;font-size:12px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:500;color:#9698a5;padding:12px 21px;border-bottom:1px solid var(--line);background:#15161a}
td{padding:13px 20px;border-bottom:1px solid #292a31}
tr:last-child td{border-bottom:0}
.name{font-weight:550}
.name small,.cell-note{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:5px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.table-foot{border-top:1px solid var(--line);padding:12px 21px;font-size:11px;color:var(--muted)}
.activity{list-style:none;padding:0;margin:0}
.activity li{padding:14px 20px;border-bottom:1px solid #292a31;display:flex;gap:13px;align-items:flex-start;font-size:12px;line-height:1.5}
.activity li:last-child{border:0}
.activity svg{width:16px;height:16px;margin-top:2px;color:#8fa99d}
.activity time{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.activity .activity-main{flex:1}
.footer{display:flex;justify-content:space-between;gap:15px;color:#91939f;font-size:10px;margin-top:26px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.input{border:1px solid #35363e;border-radius:7px;padding:10px 12px;background:#18191d;color:var(--ink);font-size:12px;min-height:38px}
.search{width:290px}
.section-gap{margin-top:20px}
.empty{padding:36px;text-align:center;color:var(--muted)}
dialog{padding:0;border:1px solid var(--line);border-radius:10px;max-width:540px;width:calc(100% - 30px);box-shadow:0 20px 80px #00000066;color:var(--ink)}
dialog::backdrop{background:#00000088;backdrop-filter:blur(2px)}
.modal-body{padding:22px;max-height:65vh;overflow:auto}
.modal-body p{font-size:12px;color:#a3a5b0;margin:0 0 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line)}
label.field{display:grid;gap:7px;font-size:12px;margin-bottom:17px}
.field small{font-size:10px;color:var(--muted);line-height:1.5}
.radio-options{display:grid;gap:10px;margin-bottom:18px}
.radio-option{border:1px solid var(--line);border-radius:8px;padding:13px;font-size:12px;display:flex;gap:10px;align-items:flex-start}
.radio-option input{margin:2px 0}
.radio-option small{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.inline-note{font-size:11px;color:#ccb78e;background:#29261f;padding:12px;border-radius:7px;line-height:1.6}
.steps{padding-left:20px;line-height:2;font-size:12px}
.sftp-path{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}
.sftp-path:last-child{border:0}
.sftp-path>div{min-width:0;overflow-wrap:anywhere}
.sftp-path .btn{flex-shrink:0}
.sftp-path small{display:block;color:var(--muted);margin-top:4px}
.login{max-width:380px;margin:55px auto;background:white;border:1px solid var(--line);padding:30px;border-radius:10px}
.login .brand{margin-bottom:32px;padding:0}
.login h1{font-size:23px;margin-bottom:10px}
.login form{margin-top:26px}
.login .btn{width:100%;margin-top:5px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#30303c;color:#18191d;padding:12px 18px;border-radius:8px;font-size:12px;z-index:10;max-width:90vw;box-shadow:0 5px 20px #0005}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.login-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}
@media(min-width:1600px){.page{padding-top:40px}
}
@media(max-width:1100px){aside{width:195px}
.shell{margin-left:195px}
header{padding:0 22px}
.page{padding:25px 22px}
.metrics{grid-template-columns:repeat(2,1fr)}
.row{grid-template-columns:1fr}
.header-right .timezone{display:none}
}
@media(max-width:680px){aside{transform:translateX(-100%);transition:transform .18s;width:235px;box-shadow:10px 0 35px #0006}
aside.open{transform:translateX(0)}
.shell{margin:0}
header{padding:0 16px;height:64px;position:sticky;top:0;z-index:2}
.mobile-toggle{display:flex}
.crumb{gap:8px}
.crumb .crumb-home{display:none}
.header-right{gap:8px}
.user .username{display:none}
.demo{font-size:10px;padding:5px 7px}
.page{padding:23px 16px}
.title-row{align-items:flex-start;flex-direction:column;gap:15px}
h1{font-size:25px}
.metrics{gap:10px}
.metric{padding:15px}
.metric-value{font-size:21px}
.metric-bottom{font-size:10px}
.metric-top{font-size:11px}
.notice{align-items:flex-start;padding:13px;flex-wrap:wrap}
.notice .btn{margin-left:30px}
.row{gap:15px}
.resource{grid-template-columns:70px 1fr 70px;gap:12px}
.card-head{padding:17px}
.card-body{padding:17px}
.footer{flex-direction:column;gap:6px}
.search{width:100%}
.toolbar .input{flex:1}
.login{margin:15px auto;padding:24px}
.storage-foot{flex-wrap:wrap}
.header-right .avatar{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}
}


:root{color-scheme:dark;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}

<body>
<aside id="sidebar" aria-label="Основная навигация"><a class="brand" href="#overview" style="color:inherit"><span class="brand-mark">u</span><span><strong>USTAR</strong><small>SERVER CONSOLE</small></span></a><div class="nav-label">УПРАВЛЕНИЕ</div><nav class="nav" id="nav"></nav><div class="aside-bottom"><div class="hostline"><span class="dot gray"></span>server1</div>Пульт на сервере Академии<br><span style="font-size:10px">Макет · соединение не настроено</span></div></aside>
<div class="shell"><header><div class="crumb"><button class="icon-btn mobile-toggle" id="menu" aria-label="Открыть меню" aria-expanded="false"></button><span class="crumb-home">Управление сервером</span><span class="crumb-home">/</span><strong id="crumb">Обзор</strong></div><div class="header-right"><span class="demo">Макет · данные примера</span><span class="timezone">MSK · UTC+3</span><button class="icon-btn user" data-action="login" aria-label="Посмотреть экран входа"><span class="avatar">AD</span><span class="username">Администратор</span></button></div></header><main class="page" id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="card-head"><h2 id="dialog-title"></h2><button class="icon-btn" id="close-dialog" aria-label="Закрыть"></button></div><div class="modal-body" id="dialog-body"></div><div class="modal-foot" id="dialog-foot"></div></dialog><div id="toast" class="toast" role="status" hidden></div>

recoveryStep(4,'Открыть и проверить Академию',`<p>На своём компьютере откройте SSH-туннель. Вместо server1 укажите привычный адрес SSH. Затем откройте http://127.0.0.1:18086/login/index.php и проверьте вход, роли, материалы и SCORM.</p>${commandBlock('tunnel','Копировать команду туннеля')}<details class="recovery-details"><summary>Отчёт о выбранном архиве и проверках</summary>${commandBlock('report','Копировать команду отчёта')}</details>`);
const portableBody=recoveryStep(1,'Выбрать проверенную копию',`<p>Используйте архив, прошедший тест на server1. Имя и SHA256 возьмите из отчёта, а не из демонстрационной таблицы.</p>${commandBlock('report','Копировать команду отчёта')}`)+
recoveryStep(2,'Скопировать комплект через SFTP',`<p>Скачайте выбранный архив .tar.gz.age и одноимённый .json. Добавьте три скрипта и файл службы. Ключ расшифровки сохраните и передайте отдельно.</p><details class="recovery-details" open><summary>Что входит в комплект</summary><ul><li>Архив и его .json из /srv/ustar-storage/backups/managed</li><li>USTAR_BACKUP_RESTORE_TEST_20261014.py — контроллер</li><li>USTAR_RESTORE_LAB_20261004.py — прежний движок</li><li>USTAR_RESTORE_PREFLIGHT_20261004.py — прежняя проверка</li><li>ustar-restore-test-20261014.service — служба запуска</li></ul></details><div class="inline-note section-gap">recovery.key переносится отдельно. Не вставляйте ключ в страницу или чат. Новый ключ старую копию не расшифрует.</div><div class="buttons">${btn('Открыть SFTP','go:sftp','','folder')}${btn('Скачать список файлов','download-kit-list','','backup')}</div><p class="copy-status">Скачивается только текстовый список. Архивы и ключ этот макет не получает.</p>`)+
recoveryStep(3,'Подготовить чистый сервер',`<p>Ubuntu 24.04 / amd64, Docker, Python 3, age и systemd. Docker должен быть пустым, если предстоит загрузка образов. Не менее 5 ГиБ доступной памяти; место проверяет контроллер. Загрузите комплект в приватный каталог и выполните установку из инструкции для чистого сервера.</p><div class="buttons">${install}</div><details class="recovery-details"><summary>Чем отличается установка на новом сервере</summary><p>Архив и .json размещаются в /var/lib/ustar-dr-input. Служба получает --input-directory /var/lib/ustar-dr-input --load-images. Образы загружаются из архива; прежний HDD и production-контейнеры не нужны. Параметры относятся только к новому серверу.</p></details>`)+
recoveryStep(4,'Запустить и проверить',`<p>После установки переносного варианта выполните ту же команду на новом сервере. Проверьте ready, вход и файлы. SSH-туннель направьте на адрес нового хоста.</p>${commandBlock('start')}<details class="recovery-details"><summary>Проверить статус</summary>${commandBlock('status')}</details><p class="copy-status">Это тестовая копия. Переключение рабочего адреса, HTTPS, почты и cron требует отдельного ввода в эксплуатацию.</p>`);
return title('Проверка восстановления','Поднять копию Академии и убедиться, что бэкап переносим',btn('К бэкапам','go:backups','','backup'))+
`<div class="recovery-modes" role="group" aria-label="Место восстановления"><button data-action="recovery-mode:local" aria-pressed="${local}">На server1</button><button data-action="recovery-mode:portable" aria-pressed="${!local}">На чистом сервере</button></div><div class="row">${card(local?'Проверка на текущем сервере':'Перенос в четыре шага',local?localBody:portableBody)}${card('Результат проверки',`<div class="card-body"><div class="acceptance"><div>Архив и контрольная сумма ${pill('Нет данных')}</div><div>Восстановление базы ${pill('Нет данных')}</div><div>Файлы Moodle ${pill('Нет данных')}</div><div>Страница входа ${pill('Нет данных')}</div><div>Роли и SCORM ${pill('Нужна ручная проверка')}</div><div>Запуск на другом сервере ${pill('Не проверен')}</div></div></div><div class="recovery-meta">Пока это инструкция с копированием команд. Статусы будут заполняться только из реального отчёта после подключения сервера. Нажатие «Копировать» не считается выполнением.</div><div class="card-body"><h3>Время работы</h3><p class="sub">Сейчас фиксировано: 1 час после готовности. Регулирование срока отложено.</p><details class="recovery-details"><summary>Остановить раньше</summary>${commandBlock('stop')}<p>Данные и отчёт остаются на диске.</p></details></div>`)}</div>`;
}
async function copyRecovery(key){const text=recoveryCommands[key];if(!text)return;try{await navigator.clipboard.writeText(text);toast('Команда скопирована. Выполните её на нужном сервере.')}catch{modal('Скопировать команду',`<p>Автокопирование недоступно. Выделите команду и скопируйте вручную.</p><textarea id="copy-command-text" class="input" rows="5" readonly>${escapeText(text)}</textarea>`);$('#copy-command-text').select()}}
function downloadKitList(){const text=`USTAR — комплект для тестового восстановления на чистом сервере\n\nЭто список файлов, не резервная копия.\n\n1. Выбранный ust ar-recovery-*.tar.gz.age (имя взять из реального отчёта).\n2. Тот же архив + .json — контрольный файл.\n3. /usr/local/sbin/USTAR_BACKUP_RESTORE_TEST_20261014.py\n4. /usr/local/sbin/USTAR_RESTORE_LAB_20261004.py\n5. /usr/local/lib/ustar-recovery/USTAR_RESTORE_PREFLIGHT_20261004.py\n6. /etc/systemd/system/ustar-restore-test-20261014.service\n\nОтдельным защищённым каналом: сохранённый recovery.key.\nНе добавлять ключ в публичные файлы/чат.\n\nИнструкция с SHA скриптов и установкой: ${recoveryGuide}\n\nПроверить на новом сервере: checksum/расшифровка, загрузка образов, БД, файлы, вход, роли, SCORM, автоостановка.\nЭтот сценарий восстанавливает тестовую копию Moodle, не весь SSD и не production DNS/TLS/SMTP/cron.\n`.replace('ust ar-','ustar-');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ustar-recovery-transfer-checklist.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Скачан список комплекта. Сам бэкап передаётся через SFTP.')}

const views={overview,server,academy,labs,backups:backupPage,sftp,alerts,operations,login,recovery};let current='overview';
function render(){current=location.hash.slice(1);if(!Object.hasOwn(views,current))current='overview';$('#main').innerHTML=views[current]()+demoFooter();$('#crumb').textContent=current==='recovery'?'Восстановление':navs.find(n=>n[0]===current)?.[1]||'Вход';$('#nav').innerHTML=navs.map(([id,label,ico])=>`<button data-action="go:${id}" ${(id===current||(current==='recovery'&&id==='backups'))?'aria-current="page"':''}>${icon(ico)}${label}${id==='alerts'?'<span class="count">1</span>':''}</button>`).join('');$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');if(current==='backups'){renderBackups();$('#backup-search').addEventListener('input',renderBackups);$('#backup-kind').addEventListener('change',renderBackups)}if(current==='login')$('#login-preview').addEventListener('submit',e=>{e.preventDefault();go('overview')});}
function go(id){if(location.hash==='#'+id)render();else location.hash=id;window.scrollTo(0,0)}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function modal(head,body,foot=''){if($('#dialog').open)$('#dialog').close();$('#dialog-title').textContent=head;$('#dialog-body').innerHTML=body;$('#dialog-foot').innerHTML=btn('Закрыть','close')+foot;$('#dialog').showModal()}
function restore(id=''){modal('Восстановление из бэкапа',`<p>${id?'Выбран демонстрационный архив '+id+'.':'Сначала выбирается проверенный архив.'} Назначение восстановления всегда указано явно.</p><div class="radio-options"><label class="radio-option"><input name="restore-target" type="radio" value="lab" checked><span><strong>Отдельный тестовый стенд</strong><small>Новые контейнеры и данные. Рабочая Академия продолжает работу. Таймер — 1 час после готовности.</small></span></label><label class="radio-option"><input name="restore-target" type="radio" value="production"><span><strong>Рабочая Академия</strong><small>С простоем и заменой текущих данных. Изменения после выбранного бэкапа будут потеряны.</small></span></label></div><div id="restore-context" class="inline-note">Тест ещё не запускался. По вашему решению он отложен до готовности пульта.</div>`,btn('Посмотреть план','restore-review','primary'));document.querySelectorAll('[name="restore-target"]').forEach(el=>el.addEventListener('change',()=>$('#restore-context').textContent=el.value==='production'?'До запуска: свежая страховочная копия, проверка архива, план отката и явное подтверждение простоя. В этом макете запуск недоступен.':'Тест ещё не запускался. По вашему решению он отложен до готовности пульта.'))}
async function act(action){const [kind,value]=action.split(':');if(kind==='recovery-mode'){recoveryMode=value==='portable'?'portable':'local';render();return}if(kind==='copy-recovery'){await copyRecovery(value);return}if(kind==='download-kit-list'){downloadKitList();return}if(kind==='go'){go(value);return}if(kind==='close'){$('#dialog').close();return}if(kind==='login'){go('login');return}if(kind==='refresh'){toast('Макет: live-данные ещё не подключены.');return}if(kind==='copy-dir'){try{await navigator.clipboard.writeText(dirs[Number(value)][1]);toast('Путь скопирован')}catch{modal('Путь каталога',`<label class="field">Скопируйте вручную<input class="input" readonly value="${dirs[Number(value)][1]}"></label>`)}return}if(kind==='backup'){const b=backups.find(x=>x.id===value);if(!b)return;modal('Резервная копия',`<p>Демонстрационная запись. Реального файла за этой строкой нет.</p>${details([['Дата',b.date],['Объект',b.kind],['Размер',b.size],['Целостность',pill(b.check,'good')],['Восстановление',pill('Не проверено','warn')]])}`,b.kind==='Академия'?btn('Восстановление','restore:'+b.id,'primary'):btn('План восстановления SSD','ssd-plan'));return}if(kind==='restore'||kind==='restore-plan'){restore(value);return}if(kind==='restore-review'){const prod=$('[name="restore-target"]:checked')?.value==='production';modal(prod?'План восстановления Академии':'План тестового восстановления',`<ol class="steps"><li>Проверить архив и доступность ключа</li><li>${prod?'Создать свежую страховочную копию':'Подготовить отдельные контейнеры и каталог'}</li><li>${prod?'Подтвердить простой и выбранную дату':'Восстановить БД, код и moodledata'}</li><li>${prod?'Восстановить и проверить Академию':'Проверить вход, материалы и роли'}</li><li>${prod?'Возобновить работу и записать результат':'Остановить стенд через час, сохранить отчёт'}</li></ol><div class="inline-note">Предпросмотр сценария. Операция не создана и команды не выполнялись.</div>`);return}if(kind==='new-backup'){modal('Создать резервную копию',`<p>Ручной бэкап использует существующий проверенный сценарий и появляется в общей истории.</p><label class="field">Что сохранить<select class="input" id="backup-object"><option>Академия — БД, код, файлы и образы</option><option>SSD сервера — отдельная операция</option></select></label><div class="inline-note" id="backup-impact">Копия Академии требует краткой паузы web. Перед настоящим запуском пульт покажет влияние и запросит подтверждение.</div>`,btn('Посмотреть этапы','backup-review','primary'));$('#backup-object').addEventListener('change',e=>$('#backup-impact').textContent=e.target.selectedIndex?'Копия SSD требует согласованной остановки нескольких служб общего сервера. Длительность зависит от объёма. Отдельное окно обслуживания.':'Копия Академии требует краткой паузы web. Перед настоящим запуском пульт покажет влияние и запросит подтверждение.');return}if(kind==='backup-review'){const ssd=$('#backup-object')?.selectedIndex===1;modal(ssd?'Копия SSD — этапы':'Копия Академии — этапы',`<ol class="steps"><li>Проверить место, диск и блокировки</li><li>${ssd?'Согласованно остановить выбранные службы':'Кратко приостановить web Академии'}</li><li>${ssd?'Скопировать данные SSD':'Сохранить БД, код, moodledata и образы'}</li><li>Возобновить службы и проверить доступность</li><li>Проверить архив и сохранить отчёт</li></ol><div class="inline-note">Предпросмотр. Бэкап не запущен.</div>`);return}
const info={schedule:['Расписание бэкапов',`<p>Текущее расписание из проекта: каждый день в 03:30 Europe/Moscow. Без дневного catch-up и автоматического удаления архивов.</p><div class="inline-note">Редактирование расписания будет подключено к действующему scheduler с проверкой конфликтов.</div>`], 'sftp-connect':['Подключение SFTP',`<p>Параметры действующего подключения внутри сети. Пароль вводится в WinSCP, пульт его не сохраняет.</p>${details([['Протокол','SFTP'],['Хост','Адрес при установке'],['Пользователь','Учётная запись SSH'],['Начальный каталог','/srv/ustar-storage']])}<div class="inline-note">Для доступа извне нужна настроенная защищённая сеть или SSH-туннель. Размещение пульта на server1 само по себе не открывает внешний доступ.</div>`],notifications:['Каналы уведомлений','<p>Telegram — предполагаемый основной канал. Нужны получатель, защищённое хранение ключа и проверка доставки. Настройка ещё не выполнена.</p><div class="inline-note">Пульт на server1 не сможет самостоятельно сообщить о полном отключении этого сервера. Для такого алерта нужен внешний контроль.</div>'],'academy-access':['Адреса Академии','<p>Адрес рабочей Академии будет прочитан из проверенной конфигурации. Случайный адрес не подставляется.</p><div class="inline-note">Пульт разместится на server1. Его порт и защищённый внешний маршрут назначаются после проверки занятых адресов и текущего SSH/VPN-доступа.</div>'],'upgrade-plan':['Обновление Moodle','<p>Подготовка Moodle 5.3 / PostgreSQL 17 сохранена. Сейчас приоритет — пульт, затем проверка восстановления, затем продолжение миграции.</p>'],'ssd-plan':['Восстановление SSD','<p>Полный архив хоста требует отдельного recovery-плана и загрузочной среды. Его нельзя восстановить поверх работающего сервера одной кнопкой.</p><div class="inline-note">Это отдельный сценарий от восстановления Moodle. Boot-восстановление пока не проверено.</div>'],'operation-info':['Этапы операции','<p>Пример будущей карточки операции: проверка условий → создание копии → возобновление web → проверка целостности → отчёт.</p><div class="inline-note">Настоящая история будет содержать исполнителя, время, код результата и безопасный журнал. Здесь операция не выполнялась.</div>']};if(info[kind])modal(...info[kind]);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)act(el.dataset.action)});$('#close-dialog').innerHTML=icon('close');$('#close-dialog').onclick=()=>$('#dialog').close();$('#menu').innerHTML=icon('menu');$('#menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}});window.addEventListener('hashchange',render);render();
</script>
