name: Host AppArmor repair fixture

on:
  pull_request:
    paths:
      - scripts/infra/host_apparmor_repair.py
      - tests/r16/test_host_apparmor_repair.py
      - .github/workflows/host-apparmor-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-parser-and-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile temporary profiles without kernel load or cache writes
        run: >-
          sudo -n env USTAR_REQUIRE_APPARMOR_PARSER=1
          "$(command -v python)" -B -m unittest
          tests.r16.test_host_apparmor_repair -v
