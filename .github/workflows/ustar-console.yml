name: USTAR console
on:
  pull_request:
    branches: [main]
    paths: ['server-console/**', '.github/workflows/ustar-console.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Locked Python dependencies
        run: |
          python -m pip install --require-hashes -r server-console/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e server-console/backend
      - name: Auth, failures, data boundaries and fixed probes
        run: python -m pytest -q server-console/tests
      - name: Actual PostgreSQL16 monitor privileges
        run: python server-console/tests/database_acceptance.py
      - name: Build isolated console artifact
        run: bash server-console/build-release.sh
      - name: Offline prototype matches the application
        run: node server-console/prototype/build.mjs --check
      - name: New console dependency audit
        working-directory: server-console/ui
        run: npm audit --audit-level=high
      - name: Chromium
        working-directory: server-console/ui
        run: npx playwright install --with-deps chromium
      - name: Desktop, tablet, mobile and failure states
        working-directory: server-console/ui
        run: npm test
      - name: systemd sandbox and artifact installation
        run: sudo --preserve-env=PATH,GITHUB_ACTIONS python server-console/tests/systemd_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ustar-console-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            server-console/dist/ustar-console.tar.gz
            server-console/dist/ustar-console.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-browser-results
          path: |
            server-console/ui/test-results
            server-console/ui/playwright-report
